<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNN LiveScore Ultimate</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #006837; /* UNN Green */
            --gold: #FFCC00;    /* UNN Gold */
            --bg-body: #090909;
            --bg-card: #141414;
            --bg-header: rgba(9, 9, 9, 0.95);
            --text-white: #ffffff;
            --text-grey: #a0a0a0;
            --accent-orange: #ff5e00;
            --success: #00b894;
            --danger: #d63031;
            --border: #222;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-body); color: var(--text-white); padding-bottom: 80px; overflow-x: hidden; }

        /* --- ANIMATIONS --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-live { 0% { box-shadow: 0 0 0 0 rgba(255, 94, 0, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(255, 94, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 94, 0, 0); } }
        @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

        /* --- HEADER --- */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; position: sticky; top: 0; background: var(--bg-header); 
            z-index: 100; border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 32px; height: 32px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; border: 2px solid var(--gold); }
        .brand-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .brand-text span { color: var(--gold); }
        
        .header-actions { display: flex; gap: 16px; align-items: center; }
        .icon-btn { position: relative; cursor: pointer; color: var(--text-white); font-size: 18px; }
        .notif-badge { position: absolute; top: -5px; right: -5px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; display: none; }
        .notif-badge.active { display: block; }

        /* --- SEARCH & NAV --- */
        .search-wrap { height: 0; overflow: hidden; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); background: var(--bg-body); }
        .search-wrap.open { height: 56px; padding: 8px 16px; }
        .search-input { width: 100%; background: #1f1f1f; border: 1px solid #333; padding: 10px 15px; border-radius: 8px; color: white; outline: none; }

        .nav-scroller { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
        .pill { 
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; 
            background: #1f1f1f; color: var(--text-grey); white-space: nowrap; cursor: pointer; 
            transition: all 0.2s; border: 1px solid transparent;
        }
        .pill.active { background: var(--text-white); color: #000; transform: scale(1.05); }

        /* --- DATE BAR --- */
        .date-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--bg-body); border-bottom: 1px solid var(--border); }
        .live-toggle { 
            background: #1f1f1f; color: var(--text-grey); padding: 5px 12px; border-radius: 4px; 
            font-size: 11px; font-weight: 800; cursor: pointer; border: 1px solid #333; letter-spacing: 0.5px; transition: 0.3s;
        }
        .live-toggle.active { background: var(--accent-orange); color: white; border-color: var(--accent-orange); animation: pulse-live 2s infinite; }

        /* --- MATCH LIST --- */
        .league-group { margin-bottom: 1px; animation: fadeIn 0.4s ease-out; }
        
        .league-header { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 12px 16px; background: #0f0f0f; border-top: 1px solid var(--border); cursor: pointer;
        }
        .lh-left { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; color: #ddd; }
        .lh-icon { color: var(--primary); }
        
        .match-row { 
            background: var(--bg-card); padding: 14px 16px; 
            display: grid; grid-template-columns: 50px 1fr 30px; 
            align-items: center; border-bottom: 1px solid #1a1a1a; 
            cursor: pointer; transition: background 0.2s; position: relative; overflow: hidden;
        }
        .match-row:active { background: #222; }
        
        /* Time Col */
        .time-col { font-size: 11px; color: var(--text-grey); display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .status-badge { font-size: 10px; font-weight: 800; padding: 2px 5px; border-radius: 3px; color: white; min-width: 35px; text-align: center; }
        .st-live { color: var(--accent-orange); }
        .st-ft { color: var(--text-grey); }
        
        /* Teams Col */
        .teams-col { padding-left: 12px; border-left: 1px solid #222; margin-left: 5px; display: flex; flex-direction: column; gap: 8px; }
        .team-row { display: flex; justify-content: space-between; align-items: center; }
        .t-info { display: flex; align-items: center; gap: 10px; }
        .t-logo { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border-radius: 50%; color: #000; }
        .t-name { font-size: 14px; font-weight: 500; }
        .t-score { font-size: 14px; font-weight: 700; color: var(--gold); width: 20px; text-align: right; }
        .t-score.dim { color: var(--text-grey); }

        /* Star */
        .star-btn { color: #333; transition: 0.2s; padding: 5px; }
        .star-btn.active { color: var(--gold); transform: scale(1.2); }

        /* Skeleton Loading */
        .skeleton-row { height: 70px; background: #141414; margin-bottom: 1px; position: relative; overflow: hidden; }
        .skeleton-row::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, #141414, #1a1a1a, #141414); animation: shimmer 1.5s infinite; }

        /* --- TOAST NOTIFICATION --- */
        .toast {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: #222; border: 1px solid var(--primary); padding: 12px 20px;
            border-radius: 30px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 2000; transition: 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* --- MODAL --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; opacity: 0; transition: 0.3s; backdrop-filter: blur(5px); }
        .modal-sheet { 
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 90vh; 
            background: #111; border-radius: 20px 20px 0 0; z-index: 1001; 
            transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column;
        }

        .m-head { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        
        .m-score-box { background: #0d0d0d; padding: 20px; display: flex; justify-content: space-around; align-items: center; }
        .ms-team { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 80px; text-align: center; }
        .ms-logo { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: black; box-shadow: 0 0 15px rgba(255,255,255,0.05); }
        .ms-val { font-size: 32px; font-weight: 800; }
        .ms-meta { font-size: 12px; color: var(--accent-orange); font-weight: bold; }

        .m-tabs { display: flex; border-bottom: 1px solid #222; }
        .m-tab { flex: 1; text-align: center; padding: 15px; font-size: 12px; font-weight: 600; color: #666; cursor: pointer; text-transform: uppercase; }
        .m-tab.active { color: white; border-bottom: 2px solid var(--accent-orange); }

        .m-content { flex: 1; overflow-y: auto; padding: 20px; }
        .tab-view { display: none; animation: fadeIn 0.3s; }
        .tab-view.active { display: block; }

        /* Stats Bars */
        .stat-row { margin-bottom: 15px; }
        .stat-label { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 5px; }
        .stat-bar-bg { height: 6px; background: #222; border-radius: 3px; overflow: hidden; display: flex; }
        .stat-fill-h { height: 100%; background: var(--gold); }
        .stat-fill-a { height: 100%; background: var(--primary); }

        /* Timeline */
        .timeline-item { display: flex; gap: 15px; margin-bottom: 15px; font-size: 13px; }
        .tl-time { width: 30px; font-weight: bold; color: #666; }
        .tl-icon { width: 20px; text-align: center; }
        
        /* Table */
        .tbl-row { display: grid; grid-template-columns: 30px 1fr 30px 30px 30px; font-size: 12px; padding: 10px 0; border-bottom: 1px solid #222; }
        .tbl-head { color: #666; font-weight: bold; }

        .hidden { display: none !important; }
        .banner { margin: 10px 15px; background: #222; height: 120px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #444; font-size: 12px; border: 1px dashed #333; }
        
    </style>
</head>
<body>

    <div class="toast" id="toast">
        <i class="fa-regular fa-futbol" style="color:var(--gold);"></i>
        <div>
            <div style="font-size:10px; color:#aaa;">GOAL!</div>
            <div style="font-size:13px; font-weight:bold;" id="toast-msg">Engineering scores!</div>
        </div>
    </div>

    <div class="header">
        <div class="brand">
            <div class="brand-logo">U</div>
            <div class="brand-text">UNN<span>Score</span></div>
        </div>
        <div class="header-actions">
            <i class="fa-regular fa-bell icon-btn">
                <div class="notif-badge"></div>
            </i>
            <i class="fa-solid fa-magnifying-glass icon-btn" onclick="toggleSearch()"></i>
            <div style="width:28px; height:28px; background:#333; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px;">JM</div>
        </div>
    </div>

    <div class="search-wrap" id="searchWrap">
        <input type="text" class="search-input" placeholder="Search team, hostel or faculty..." onkeyup="debounceSearch(this.value)">
    </div>

    <div class="nav-scroller">
        <div class="pill active" onclick="filterSport(this, 'football')">Football</div>
        <div class="pill" onclick="filterSport(this, 'basketball')">Basketball</div>
        <div class="pill" onclick="filterFavorite(this)">Favorites</div>
    </div>
<div class="banner">
        <div><i class="fa-solid fa-graduation-cap"></i> SUG WEEK STARTS MONDAY</div>
</div>
    <div class="date-bar">
        <div class="live-toggle" onclick="toggleLive(this)">LIVE</div>
        <div style="font-size:13px; font-weight:700;">TODAY</div>
        <i class="fa-regular fa-calendar" style="color:#666;"></i>
    </div>

    <div id="app-container">
        </div>

    <div class="modal-overlay" id="overlay" onclick="closeModal()"></div>
    <div class="modal-sheet" id="sheet">
        <div class="m-head">
            <div style="font-size:12px; font-weight:700; color:#888;" id="md-league">LEAGUE</div>
            <i class="fa-solid fa-chevron-down" style="color:#666; cursor:pointer;" onclick="closeModal()"></i>
        </div>

        <div class="m-score-box">
            <div class="ms-team">
                <div class="ms-logo" id="md-l1" style="background:#eee;">H</div>
                <div style="font-size:12px; margin-top:5px; color:#ccc;" id="md-h">Home</div>
            </div>
            <div style="text-align:center;">
                <div class="ms-val" id="md-score">-</div>
                <div class="ms-meta" id="md-time">--</div>
            </div>
            <div class="ms-team">
                <div class="ms-logo" id="md-l2" style="background:#333; color:white;">A</div>
                <div style="font-size:12px; margin-top:5px; color:#ccc;" id="md-a">Away</div>
            </div>
        </div>

        <div class="m-tabs">
            <div class="m-tab active" onclick="tab('info', this)">Info</div>
            <div class="m-tab" onclick="tab('timeline', this)">Timeline</div>
            <div class="m-tab" onclick="tab('stats', this)">Stats</div>
            <div class="m-tab" onclick="tab('table', this)">Table</div>
        </div>

        <div class="m-content">
            <div id="t-info" class="tab-view active">
                <div style="background:#1a1a1a; padding:15px; border-radius:10px;">
                    <div class="timeline-item"><i class="fa-solid fa-location-dot tl-icon"></i> Franco Pitch A</div>
                    <div class="timeline-item"><i class="fa-solid fa-user tl-icon"></i> Ref. Emeka</div>
                </div>
            </div>

            <div id="t-timeline" class="tab-view">
                <div id="timeline-box"></div>
            </div>

            <div id="t-stats" class="tab-view">
                <div id="stats-box"></div>
            </div>

            <div id="t-table" class="tab-view">
                <div class="tbl-row tbl-head">
                    <div>#</div> <div>Team</div> <div>P</div> <div>GD</div> <div>Pts</div>
                </div>
                <div id="table-box"></div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. STATE & DATA ---
        let state = {
            sport: 'football',
            liveOnly: false,
            favOnly: false,
            search: '',
            favorites: JSON.parse(localStorage.getItem('unn_favs')) || []
        };

        // The "Database"
        const matches = [
            { id: 1, sport: 'football', league: 'Inter-Faculty Games', sub:'Main Campus', home: 'Engineering', away: 'Bio Sciences', hScore: 2, aScore: 1, time: 88, status: 'LIVE', c1:'#FFD700', c2:'#008000' },
            { id: 2, sport: 'football', league: 'Inter-Faculty Games', sub:'Main Campus', home: 'Law', away: 'Medicine', hScore: 0, aScore: 0, time: 14, status: 'LIVE', c1:'#FFF', c2:'#F00' },
            { id: 3, sport: 'football', league: 'VC Hostel League', sub:'Boys', home: 'Alvan Ikoku', away: 'Eni Njoku', hScore: 1, aScore: 1, time: 45, status: 'HT', c1:'#A52A2A', c2:'#4682B4' },
            { id: 4, sport: 'football', league: 'VC Hostel League', sub:'Boys', home: 'Zik Flats', away: 'Mbanefo', hScore: 0, aScore: 0, time: 0, status: 'UPCOMING', c1:'#4B0082', c2:'#333' },
            { id: 5, sport: 'football', league: 'Departmental Cup', sub:'Group A', home: 'Comp. Sci', away: 'Physics', hScore: 3, aScore: 2, time: 90, status: 'FT', c1:'#000', c2:'#FFF' },
            { id: 6, sport: 'basketball', league: 'Indoor Games', sub:'Finals', home: 'Pharmacy', away: 'Dentistry', hScore: 45, aScore: 40, time: 3, status: 'LIVE', c1:'#FFF', c2:'#888' }
        ];

        // --- 2. RENDER ENGINE ---
        function render() {
            const container = document.getElementById('app-container');
            
            // 1. Filter
            let filtered = matches.filter(m => {
                const sMatch = m.sport === state.sport;
                const lMatch = state.liveOnly ? (m.status === 'LIVE' || m.status === 'HT') : true;
                const fMatch = state.favOnly ? state.favorites.includes(m.id) : true;
                const qMatch = m.home.toLowerCase().includes(state.search) || m.away.toLowerCase().includes(state.search);
                return sMatch && lMatch && fMatch && qMatch;
            });

            // 2. Loading Skeleton (Simulated)
            if(!container.hasChildNodes() && filtered.length > 0) {
                container.innerHTML = `<div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>`;
            }

            // 3. Build HTML
            const frag = document.createDocumentFragment();
            const leagues = [...new Set(filtered.map(m => m.league))];

            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; color:#444;">No matches found</div>`;
                return;
            }

            leagues.forEach(lg => {
                const sub = filtered.find(m => m.league === lg).sub;
                const group = document.createElement('div');
                group.className = 'league-group';
                
                // League Header with collapse logic
                group.innerHTML = `
                    <div class="league-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
                        <div class="lh-left"><i class="fa-solid fa-trophy lh-icon"></i> ${lg} <span style="font-weight:400; color:#666; margin-left:5px;">${sub}</span></div>
                        <i class="fa-solid fa-chevron-down" style="font-size:10px; color:#666;"></i>
                    </div>
                    <div class="match-list"></div>
                `;

                const list = group.querySelector('.match-list');

                filtered.filter(m => m.league === lg).forEach(m => {
                    const isLive = m.status === 'LIVE';
                    const isFav = state.favorites.includes(m.id);
                    const timeDisplay = isLive ? `<span class="st-live">${m.time}'</span>` : `<span class="st-ft">${m.status === 'UPCOMING' ? formatTime(m) : m.status}</span>`;
                    const c1Text = isLight(m.c1) ? 'black' : 'white';
                    const c2Text = isLight(m.c2) ? 'black' : 'white';
                    const scoreDisplay = m.status === 'UPCOMING' ? '?' : m.hScore;
                    const scoreDisplayA = m.status === 'UPCOMING' ? '?' : m.aScore;

                    const row = document.createElement('div');
                    row.className = 'match-row';
                    row.onclick = () => openModal(m.id);
                    row.innerHTML = `
                        <div class="time-col">
                            ${timeDisplay}
                            ${isLive ? '<div style="width:4px; height:4px; background:var(--accent-orange); border-radius:50%;"></div>' : ''}
                        </div>
                        <div class="teams-col">
                            <div class="team-row">
                                <div class="t-info"><div class="t-logo" style="background:${m.c1}; color:${c1Text}">${m.home[0]}</div> <div class="t-name">${m.home}</div></div>
                                <div class="t-score ${m.status === 'UPCOMING' ? 'dim' : ''}">${scoreDisplay}</div>
                            </div>
                            <div class="team-row">
                                <div class="t-info"><div class="t-logo" style="background:${m.c2}; color:${c2Text}">${m.away[0]}</div> <div class="t-name">${m.away}</div></div>
                                <div class="t-score ${m.status === 'UPCOMING' ? 'dim' : ''}">${scoreDisplayA}</div>
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <i class="fa-${isFav ? 'solid' : 'regular'} fa-star star-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${m.id})"></i>
                        </div>
                    `;
                    list.appendChild(row);
                });
                frag.appendChild(group);
            });

            container.innerHTML = '';
            container.appendChild(frag);
        }

        // --- 3. SIMULATION ENGINE (The "Live" Part) ---
        setInterval(() => {
            const liveMatches = matches.filter(m => m.status === 'LIVE');
            if(liveMatches.length > 0) {
                // 1. Tick Time
                liveMatches.forEach(m => {
                    if(m.time < 90) m.time++;
                });

                // 2. Random Goal (10% chance)
                if(Math.random() > 0.9) {
                    const m = liveMatches[Math.floor(Math.random() * liveMatches.length)];
                    const scorer = Math.random() > 0.5 ? 'home' : 'away';
                    if(scorer === 'home') m.hScore++; else m.aScore++;
                    
                    showToast(`GOAL! ${scorer === 'home' ? m.home : m.away} scores!`);
                }
                
                render(); // Re-render to show new times/scores
                if(document.getElementById('sheet').style.bottom === '0px') updateModal(); // Update modal if open
            }
        }, 5000); // Runs every 5 seconds

        // --- 4. MODAL LOGIC (Stats & Tables) ---
        let currentMatchId = null;

        function openModal(id) {
            currentMatchId = id;
            updateModal();
            document.getElementById('overlay').style.display = 'block';
            setTimeout(() => {
                document.getElementById('overlay').style.opacity = '1';
                document.getElementById('sheet').style.bottom = '0';
            }, 10);
        }

        function updateModal() {
            if(!currentMatchId) return;
            const m = matches.find(x => x.id === currentMatchId);
            
            // Header
            document.getElementById('md-league').innerText = m.league;
            document.getElementById('md-h').innerText = m.home;
            document.getElementById('md-a').innerText = m.away;
            document.getElementById('md-score').innerText = m.status === 'UPCOMING' ? 'VS' : `${m.hScore} - ${m.aScore}`;
            document.getElementById('md-time').innerText = m.status === 'LIVE' ? m.time + "'" : m.status;
            
            document.getElementById('md-l1').innerText = m.home[0]; document.getElementById('md-l1').style.background = m.c1;
            document.getElementById('md-l2').innerText = m.away[0]; document.getElementById('md-l2').style.background = m.c2;

            // Generate Stats (Random for demo)
            const hPoss = m.status === 'UPCOMING' ? 50 : Math.floor(Math.random() * 30) + 35;
            document.getElementById('stats-box').innerHTML = `
                ${createStatBar('Possession', hPoss, 100-hPoss)}
                ${createStatBar('Shots', Math.floor(hPoss/5), Math.floor((100-hPoss)/5))}
                ${createStatBar('Yellow Cards', 1, 2)}
            `;

            // Generate Timeline
            document.getElementById('timeline-box').innerHTML = m.hScore > 0 ? 
                `<div class="timeline-item"><div class="tl-time">12'</div><div class="tl-icon">⚽</div><div>Goal for ${m.home}</div></div>` : '<div style="text-align:center; padding:20px; color:#444;">No events yet</div>';

            // Generate Table (Logic)
            generateTable(m.league);
        }

        function generateTable(leagueName) {
            // Filter matches from this league
            const leagueMatches = matches.filter(m => m.league === leagueName);
            // Get unique teams
            const teams = [...new Set([...leagueMatches.map(m=>m.home), ...leagueMatches.map(m=>m.away)])];
            
            // Calculate Points (Simplified)
            let standings = teams.map(t => {
                let pts = 0;
                // Add fake points for realism if no data
                pts += Math.floor(Math.random() * 10); 
                return { name: t, pts: pts, p: 5, gd: Math.floor(Math.random()*5) };
            }).sort((a,b) => b.pts - a.pts);

            let html = '';
            standings.forEach((t, i) => {
                html += `<div class="tbl-row"><div>${i+1}</div> <div>${t.name}</div> <div>${t.p}</div> <div>${t.gd}</div> <div style="font-weight:bold; color:white;">${t.pts}</div></div>`;
            });
            document.getElementById('table-box').innerHTML = html;
        }

        // --- 5. INTERACTION HANDLERS ---
        function filterSport(el, s) {
            document.querySelectorAll('.nav-scroller .pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            state.sport = s;
            state.favOnly = false;
            render();
        }

        function filterFavorite(el) {
            document.querySelectorAll('.nav-scroller .pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            state.favOnly = true;
            render();
        }

        function toggleLive(el) {
            state.liveOnly = !state.liveOnly;
            el.classList.toggle('active');
            render();
        }

        function toggleFav(e, id) {
            e.stopPropagation();
            if(state.favorites.includes(id)) {
                state.favorites = state.favorites.filter(x => x !== id);
            } else {
                state.favorites.push(id);
            }
            localStorage.setItem('unn_favs', JSON.stringify(state.favorites));
            render();
        }

        function tab(name, el) {
            document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
            document.getElementById('t-'+name).classList.add('active');
            document.querySelectorAll('.m-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function closeModal() {
            document.getElementById('sheet').style.bottom = '-100%';
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('overlay').style.display = 'none', 300);
            currentMatchId = null;
        }

        function toggleSearch() {
            document.getElementById('searchWrap').classList.toggle('open');
            if(document.getElementById('searchWrap').classList.contains('open')) document.querySelector('.search-input').focus();
        }

        let debounceTimer;
        function debounceSearch(val) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                state.search = val.toLowerCase();
                render();
            }, 300);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // --- HELPERS ---
        function createStatBar(label, hVal, aVal) {
            const total = hVal + aVal;
            const hPct = (hVal/total)*100;
            return `
            <div class="stat-row">
                <div class="stat-label"><span>${hVal}</span> <span>${label}</span> <span>${aVal}</span></div>
                <div class="stat-bar-bg">
                    <div style="width:${hPct}%; background:var(--gold);"></div>
                    <div style="width:${100-hPct}%; background:var(--primary);"></div>
                </div>
            </div>`;
        }

        function isLight(color) {
            const hex = color.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            return ((r * 299) + (g * 587) + (b * 114)) / 1000 > 155;
        }

        function formatTime(m) { return '20:00'; } // Simplified for demo

        // Init
        render();

    </script>
</body>
</html>
